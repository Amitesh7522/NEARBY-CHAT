{% load i18n %}
<!-- Report Modal -->
<div id="report-modal" class="modal-overlay" aria-hidden="true" role="dialog">
  <div class="modal-card">
    <div class="modal-header">
      <h3>{% trans "Report Violation" %}</h3>
      <button onclick="window.closeModal('report-modal')" class="btn-icon" aria-label="{% trans 'Close' %}">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>

    <form action="{% url 'safety:file_report' %}" method="post">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ request.get_full_path }}">
      <input type="hidden" id="report-username-input" name="reported_username" value="">
      <input type="hidden" id="report-room-id-input" name="reported_room_id" value="">
      <input type="hidden" id="report-message-id-input" name="reported_message_id" value="">

      <div class="form-group">
        <label class="form-label">{% trans "Reason" %}</label>
        <select name="reason" class="input-field select-field" required>
          <option value="harassment">{% trans "Harassment or Bullying" %}</option>
          <option value="hate_speech">{% trans "Hate Speech or Abuse" %}</option>
          <option value="spam">{% trans "Spam or Scam" %}</option>
          <option value="inappropriate_content">{% trans "Nudity or Inappropriate Content" %}</option>
          <option value="violence">{% trans "Violence or Threats" %}</option>
          <option value="other">{% trans "Other Violation" %}</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">{% trans "Details / Additional Context" %}</label>
        <textarea name="details" class="input-field" rows="3" placeholder="{% trans 'Describe what occurred...' %}"></textarea>
      </div>

      <div class="modal-footer">
        <button type="button" onclick="window.closeModal('report-modal')" class="btn btn-secondary">{% trans "Cancel" %}</button>
        <button type="submit" class="btn btn-danger">{% trans "Submit Report" %}</button>
      </div>
    </form>
  </div>
</div>

<script>
  window.openReportModal = function(opts = {}) {
    document.getElementById('report-username-input').value = opts.username || '';
    document.getElementById('report-room-id-input').value = opts.roomId || '';
    document.getElementById('report-message-id-input').value = opts.messageId || '';
    window.openModal('report-modal');
  };
</script>
