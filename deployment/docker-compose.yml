version: '3.9'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: nearby_chat_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-nearby_chat_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis In-Memory Broker & Cache
  redis:
    image: redis:7-alpine
    container_name: nearby_chat_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

  # Django Web Server (ASGI Daphne)
  web:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    container_name: nearby_chat_web
    restart: unless-stopped
    command: daphne -b 0.0.0.0 -p 8000 nearby_chat.asgi:application
    volumes:
      - media_volume:/app/media
      - static_volume:/app/staticfiles
    environment:
      - DJANGO_SETTINGS_MODULE=nearby_chat.settings.production
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DJANGO_DEBUG=False
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      - DB_ENGINE=postgresql
      - DB_NAME=${DB_NAME:-nearby_chat_db}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_HOST=db
      - DB_PORT=5432
      - USE_REDIS=True
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: nearby_chat_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media_volume:/var/www/media:ro
      - static_volume:/var/www/static:ro
    depends_on:
      - web

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
