services:
  # Nearby Chat Web Service (ASGI Daphne + WebSockets)
  - type: web
    name: nearby-chat
    env: python
    region: singapore # Low-latency region for India
    plan: starter # $7/mo Starter plan with 24/7 uptime & WebSockets support
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput"
    startCommand: "daphne -b 0.0.0.0 -p $PORT nearby_chat.asgi:application"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: nearby_chat.settings.production
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "nearbychat.in,www.nearbychat.in,.onrender.com,localhost"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://nearbychat.in,https://www.nearbychat.in,https://*.onrender.com"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: nearby-chat-db
          property: connectionString
      - key: BREVO_API_KEY
        sync: false # Set securely in Render dashboard
      - key: BREVO_SENDER_EMAIL
        value: "no-reply@nearbychat.in"
      - key: BREVO_SENDER_NAME
        value: "Nearby Chat"

databases:
  # Managed PostgreSQL Database
  - name: nearby-chat-db
    region: singapore
    plan: starter # $7/mo Starter managed Postgres
    databaseName: nearby_chat
    user: nearby_chat_user
