<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="100%" height="100%">
  <defs>
    <!-- Wave Gradients -->
    <linearGradient id="logoWaveCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>

    <linearGradient id="logoWaveRose" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <linearGradient id="logoTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
  </defs>

  <!-- Left Icon Mark (48x48) -->
  <g transform="translate(6, 8)">
    <!-- Base Squircle -->
    <rect width="48" height="48" rx="14" fill="#0B0F19" stroke="#1E293B" stroke-width="1.2"/>
    
    <!-- Ambient Rings -->
    <circle cx="24" cy="24" r="16" stroke="#6366F1" stroke-width="0.8" stroke-dasharray="2 2" stroke-opacity="0.25"/>

    <!-- Left Arc (N glyph) -->
    <path d="M14 34V18C14 13.5 17.5 10 22 10C26.5 10 30 13.5 30 18V21" 
          stroke="url(#logoWaveCyan)" 
          stroke-width="4.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Right Arc (N glyph) -->
    <path d="M34 14V30C34 34.5 30.5 38 26 38C21.5 38 18 34.5 18 30V27" 
          stroke="url(#logoWaveRose)" 
          stroke-width="4.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Center Nexus -->
    <circle cx="24" cy="24" r="2" fill="#FFFFFF"/>
  </g>

  <!-- Typography Brandmark -->
  <text x="68" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.5px">
    <tspan fill="#F8FAFC">Nearby</tspan>
    <tspan fill="url(#logoTextGrad)" font-weight="900">Chat</tspan>
  </text>

  <!-- Small Radar Pulse dot next to Chat -->
  <circle cx="218" cy="25" r="3.5" fill="#22D3EE"/>
  <circle cx="218" cy="25" r="6" stroke="#22D3EE" stroke-width="1" stroke-opacity="0.4"/>
</svg>
