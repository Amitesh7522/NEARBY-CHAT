<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="lionBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
    <linearGradient id="maneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <circle cx="50" cy="50" r="48" fill="url(#lionBg)"/>

  <!-- Mane (Fluffy Cloud Shape) -->
  <g fill="url(#maneGrad)">
    <circle cx="50" cy="24" r="14"/>
    <circle cx="68" cy="28" r="14"/>
    <circle cx="78" cy="44" r="14"/>
    <circle cx="78" cy="62" r="14"/>
    <circle cx="66" cy="76" r="14"/>
    <circle cx="50" cy="80" r="14"/>
    <circle cx="34" cy="76" r="14"/>
    <circle cx="22" cy="62" r="14"/>
    <circle cx="22" cy="44" r="14"/>
    <circle cx="32" cy="28" r="14"/>
  </g>

  <!-- Ears -->
  <circle cx="28" cy="34" r="8" fill="url(#faceGrad)"/>
  <circle cx="28" cy="34" r="4" fill="#FDE68A"/>
  <circle cx="72" cy="34" r="8" fill="url(#faceGrad)"/>
  <circle cx="72" cy="34" r="4" fill="#FDE68A"/>

  <!-- Head -->
  <circle cx="50" cy="54" r="26" fill="url(#faceGrad)"/>

  <!-- Muzzle -->
  <ellipse cx="44" cy="62" rx="6.5" ry="5.5" fill="#FFFFFF"/>
  <ellipse cx="56" cy="62" rx="6.5" ry="5.5" fill="#FFFFFF"/>

  <!-- Eyes -->
  <circle cx="38" cy="48" r="4" fill="#1E293B"/>
  <circle cx="39.5" cy="46.5" r="1.5" fill="#FFFFFF"/>
  <circle cx="62" cy="48" r="4" fill="#1E293B"/>
  <circle cx="63.5" cy="46.5" r="1.5" fill="#FFFFFF"/>

  <!-- Nose & Smile -->
  <polygon points="46,58 54,58 50,62" fill="#78350F"/>
  <path d="M46 63 Q50 67 54 63" stroke="#78350F" stroke-width="1.8" fill="none" stroke-linecap="round"/>
</svg>
