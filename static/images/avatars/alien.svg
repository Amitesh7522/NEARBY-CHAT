<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="alienBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B"/>
      <stop offset="100%" stop-color="#27272A"/>
    </linearGradient>
    <linearGradient id="alienSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>
    <linearGradient id="alienEye" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <circle cx="50" cy="50" r="48" fill="url(#alienBg)"/>

  <!-- Antennae -->
  <path d="M38 28 Q30 14 26 18" stroke="#4ADE80" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <circle cx="26" cy="18" r="4.5" fill="#FACC15"/>
  <path d="M62 28 Q70 14 74 18" stroke="#4ADE80" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <circle cx="74" cy="18" r="4.5" fill="#FACC15"/>

  <!-- Head -->
  <ellipse cx="50" cy="54" rx="34" ry="28" fill="url(#alienSkin)"/>

  <!-- Big Cosmic Eyes -->
  <ellipse cx="34" cy="50" rx="9" ry="12" transform="rotate(-12 34 50)" fill="url(#alienEye)"/>
  <circle cx="34" cy="46" r="3.5" fill="#FFFFFF"/>
  <circle cx="36" cy="54" r="1.5" fill="#FFFFFF"/>

  <ellipse cx="66" cy="50" rx="9" ry="12" transform="rotate(12 66 50)" fill="url(#alienEye)"/>
  <circle cx="66" cy="46" r="3.5" fill="#FFFFFF"/>
  <circle cx="64" cy="54" r="1.5" fill="#FFFFFF"/>

  <!-- Smile -->
  <path d="M45 68 Q50 72 55 68" stroke="#0F5132" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Blush -->
  <ellipse cx="24" cy="58" rx="4" ry="2" fill="#F472B6" opacity="0.6"/>
  <ellipse cx="76" cy="58" rx="4" ry="2" fill="#F472B6" opacity="0.6"/>
</svg>
