<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="spaceBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
    <linearGradient id="visorGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- Cosmic Background -->
  <circle cx="50" cy="50" r="48" fill="url(#spaceBg)"/>

  <!-- Stars -->
  <circle cx="20" cy="24" r="1.5" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="80" cy="30" r="1" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="24" cy="76" r="1" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="76" cy="80" r="1.5" fill="#FFFFFF" opacity="0.9"/>

  <!-- Helmet Outer -->
  <circle cx="50" cy="50" r="34" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>

  <!-- Helmet Visor -->
  <ellipse cx="50" cy="48" rx="24" ry="18" fill="url(#visorGold)"/>

  <!-- Visor Gloss Reflection -->
  <path d="M34 40 Q50 34 62 38 Q50 38 34 44 Z" fill="#FFFFFF" opacity="0.7"/>

  <!-- Helmet Details -->
  <rect x="42" y="74" width="16" height="6" rx="2" fill="#94A3B8"/>
  <!-- Helmet Earpieces -->
  <circle cx="17" cy="50" r="4" fill="#94A3B8"/>
  <circle cx="83" cy="50" r="4" fill="#94A3B8"/>
</svg>
